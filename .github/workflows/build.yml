name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch (12.1 recommended)'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '14.1'
          - '16.0'
      LUNCH_TARGET:
        description: 'Lunch Target'
        required: true
        default: 'twrp_PD2227-eng'
        type: choice
        options:
          - twrp_PD2227-eng
          - twrp_PD2227-userdebug
          - omni_PD2227-eng
          - omni_PD2227-userdebug

jobs:
  build:
    name: Build OrangeFox Recovery for vivo X90 Pro+ (PD2227)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Free Disk Space
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/.ghcup
          sudo docker system prune -a -f --volumes || true
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 \
            rsync cpio bc libssl-dev git-lfs

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@orangefox.download"

      - name: Sync OrangeFox Tree via Official Sync Tool
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git ~/sync
          cd ~/sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH || '12.1' }} --path /home/runner/fox

      - name: Setup Device Tree
        run: |
          mkdir -p /home/runner/fox/device/vivo/PD2227
          cp -r $GITHUB_WORKSPACE/device/vivo/PD2227/* /home/runner/fox/device/vivo/PD2227/
          ls -la /home/runner/fox/device/vivo/PD2227/

      - name: Build OrangeFox Recovery
        run: |
          cd /home/runner/fox
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export LC_ALL="C"
          lunch ${{ github.event.inputs.LUNCH_TARGET || 'twrp_PD2227-eng' }}
          mka recoveryimage -j$(nproc --all)

      - name: Prepare Artifacts
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          find /home/runner/fox/out/target/product/PD2227 -maxdepth 1 -name "OrangeFox*.zip" -exec cp {} $GITHUB_WORKSPACE/artifacts/ \; 2>/dev/null || true
          find /home/runner/fox/out/target/product/PD2227 -maxdepth 1 -name "recovery.img" -exec cp {} $GITHUB_WORKSPACE/artifacts/ \; 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/artifacts/

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-PD2227-${{ github.run_id }}
          path: artifacts/*
